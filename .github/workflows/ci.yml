name: ci

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch each run: incremental state and debug info only cost compile and link time.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: File size
        run: node scripts/size-check.mjs

  rust:
    needs: size
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No doc tests exist; `--lib --bins --tests` skips the doctest pass (harness-ui alone took ~45s).
      # The release workflow builds the exe, so no extra build step here.
      - name: Test
        run: >-
          cargo test --workspace --lib --bins --tests
          --exclude harness-app --exclude harness-host --exclude harness-host-control
          --exclude harness-host-protocol --exclude harness-sidecar --exclude harness-protocol
